name: Release

# Publishes to npm, PyPI, and crates.io using OIDC trusted publishing.
# There are no stored registry tokens: each publish job requests a
# short-lived OIDC token from GitHub (permissions.id-token: write) and
# exchanges it with the registry for a one-time credential.
#
# This must stay at .github/workflows/release.yml and the publish jobs
# must run in the "release" GitHub Actions environment — both are the
# exact values registered with each registry's Trusted Publisher config
# for GagaKor/rtsp-backchannel. Renaming the file or the environment
# breaks OIDC verification and publishing is rejected.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue rather than cancel: a half-finished publish cannot be undone,
  # so a newer run must never interrupt one already talking to a registry.
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Reads the three manifest versions and compares each against what is
  # currently live on its registry. A package only publishes when its
  # manifest version differs from the published one, so routine merges
  # (e.g. Dependabot bumps) that don't touch a version number publish
  # nothing. A registry 404 (package never published) counts as "needs
  # publishing", not as an error.
  check-versions:
    name: Check manifest vs. published versions
    if: github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      npm-version: ${{ steps.gate.outputs.npm-version }}
      npm-publish: ${{ steps.gate.outputs.npm-publish }}
      pypi-version: ${{ steps.gate.outputs.pypi-version }}
      pypi-publish: ${{ steps.gate.outputs.pypi-publish }}
      crates-version: ${{ steps.gate.outputs.crates-version }}
      crates-publish: ${{ steps.gate.outputs.crates-publish }}
      release-tag: ${{ steps.release-state.outputs.tag }}
      release-tag-exists: ${{ steps.release-state.outputs.tag-exists }}
      github-release-needed: ${{ steps.release-state.outputs.release-needed }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare manifest versions against published versions
        id: gate
        run: |
          set -euo pipefail

          npm_manifest=$(jq -r '.version' package.json)
          npm_lock=$(jq -r '.version' package-lock.json)
          npm_package_lock=$(jq -r '.packages[""].version' package-lock.json)
          pypi_manifest=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          crates_manifest=$(grep -m1 '^version' rust/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          crates_lock=$(awk '
            $0 == "name = \"rtsp-backchannel\"" { found = 1; next }
            found && /^version = / {
              gsub(/^version = \"|\"$/, "")
              print
              exit
            }
          ' rust/Cargo.lock)

          echo "npm manifest version: $npm_manifest"
          echo "npm lock versions: $npm_lock, $npm_package_lock"
          echo "pypi manifest version: $pypi_manifest"
          echo "crates manifest version: $crates_manifest"
          echo "crates lock version: $crates_lock"

          if [ "$npm_manifest" != "$npm_lock" ] || \
             [ "$npm_manifest" != "$npm_package_lock" ] || \
             [ "$npm_manifest" != "$pypi_manifest" ] || \
             [ "$npm_manifest" != "$crates_manifest" ] || \
             [ "$npm_manifest" != "$crates_lock" ]; then
            echo "Release versions must match in all five manifests and lock files." >&2
            exit 1
          fi

          # Prints "<body>\n<http_status>" so the status can be split off
          # without a second request.
          fetch() {
            local url="$1"; shift
            curl -sS -w '\n%{http_code}' "$@" "$url"
          }

          npm_response=$(fetch "https://registry.npmjs.org/rtsp-backchannel")
          npm_status="${npm_response##*$'\n'}"
          npm_body="${npm_response%$'\n'*}"
          if [ "$npm_status" = "404" ]; then
            npm_published=""
          elif [ "$npm_status" = "200" ]; then
            npm_published=$(printf '%s' "$npm_body" | jq -r '.["dist-tags"].latest')
          else
            echo "npm registry query failed with HTTP $npm_status" >&2
            exit 1
          fi

          pypi_response=$(fetch "https://pypi.org/pypi/rtsp-backchannel/json")
          pypi_status="${pypi_response##*$'\n'}"
          pypi_body="${pypi_response%$'\n'*}"
          if [ "$pypi_status" = "404" ]; then
            pypi_published=""
          elif [ "$pypi_status" = "200" ]; then
            pypi_published=$(printf '%s' "$pypi_body" | jq -r '.info.version')
          else
            echo "PyPI registry query failed with HTTP $pypi_status" >&2
            exit 1
          fi

          # crates.io rejects requests with no User-Agent.
          crates_response=$(fetch "https://crates.io/api/v1/crates/rtsp-backchannel" -A "rtsp-backchannel-release-workflow (https://github.com/GagaKor/rtsp-backchannel)")
          crates_status="${crates_response##*$'\n'}"
          crates_body="${crates_response%$'\n'*}"
          if [ "$crates_status" = "404" ]; then
            crates_published=""
          elif [ "$crates_status" = "200" ]; then
            crates_published=$(printf '%s' "$crates_body" | jq -r '.crate.max_version')
          else
            echo "crates.io registry query failed with HTTP $crates_status" >&2
            exit 1
          fi

          echo "npm published version: ${npm_published:-<none>}"
          echo "pypi published version: ${pypi_published:-<none>}"
          echo "crates published version: ${crates_published:-<none>}"

          if [ "$npm_manifest" != "$npm_published" ]; then npm_publish=true; else npm_publish=false; fi
          if [ "$pypi_manifest" != "$pypi_published" ]; then pypi_publish=true; else pypi_publish=false; fi
          if [ "$crates_manifest" != "$crates_published" ]; then crates_publish=true; else crates_publish=false; fi

          {
            echo "npm-version=$npm_manifest"
            echo "npm-publish=$npm_publish"
            echo "pypi-version=$pypi_manifest"
            echo "pypi-publish=$pypi_publish"
            echo "crates-version=$crates_manifest"
            echo "crates-publish=$crates_publish"
          } >> "$GITHUB_OUTPUT"

      # This gate prevents routine master pushes from rebuilding five native
      # binaries after the current version already has a GitHub Release. Tag
      # and release state are separate: a previous run may have pushed the tag
      # and then failed while creating the release, in which case a retry must
      # rebuild the assets and finish the missing release.
      - name: Check GitHub tag and release state
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.gate.outputs.npm-version }}"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
          else
            tag_exists=false
          fi

          release_status=$(curl -sS -o "$RUNNER_TEMP/github-release.json" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")

          case "$release_status" in
            200) release_needed=false ;;
            404) release_needed=true ;;
            *)
              echo "GitHub release query failed with HTTP ${release_status}" >&2
              cat "$RUNNER_TEMP/github-release.json" >&2
              exit 1
              ;;
          esac

          echo "release tag: ${tag} (exists: ${tag_exists})"
          echo "GitHub Release needed: ${release_needed}"

          {
            echo "tag=${tag}"
            echo "tag-exists=${tag_exists}"
            echo "release-needed=${release_needed}"
          } >> "$GITHUB_OUTPUT"

  publish-npm:
    name: Publish npm package
    needs: check-versions
    if: github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master' && needs.check-versions.outputs.npm-publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Deliberately no `registry-url` here. Passing it makes setup-node write
      # an .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and point NPM_CONFIG_USERCONFIG at it. With no NODE_AUTH_TOKEN set that
      # resolves to an empty credential, and npm — seeing a token already
      # configured — never attempts the OIDC exchange, so the publish is
      # rejected with a bare `E404 PUT`. That is exactly how the 0.3.0 npm
      # publish failed while PyPI and crates.io succeeded from this same job's
      # `release` environment. npm defaults to the public registry anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm's OIDC trusted publishing needs npm CLI >= 11.5.1, newer than the
      # npm bundled with Node 22. Track the latest release rather than pinning:
      # the feature is young and pinning the first version that shipped it
      # keeps us on the least-fixed one.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm publish --access public

  publish-pypi:
    name: Publish PyPI package
    needs: check-versions
    if: github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master' && needs.check-versions.outputs.pypi-publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: PYTHONPATH=python:. python -m unittest discover -s python -p 'test_*.py'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: PYTHONPATH=python:. python -m unittest discover -s python -p 'test_*.py'

      - run: python -m pip install --upgrade build twine
      - run: python -m build --outdir "$RUNNER_TEMP/python-dist" python
      - run: python -m twine check "$RUNNER_TEMP"/python-dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: ${{ runner.temp }}/python-dist

  publish-crates:
    name: Publish crates.io package
    needs: check-versions
    if: github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master' && needs.check-versions.outputs.crates-publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal
      - run: cargo +1.86.0 test --manifest-path rust/Cargo.toml --locked

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish to crates.io
        run: cargo +1.86.0 publish --manifest-path rust/Cargo.toml --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  # Builds the Rust CLI as a single native binary for every supported
  # platform. This is the project's answer for "run the CLI
  # without installing Node, Python, or Rust" and feeds the GitHub Release
  # created by tag-and-release below. This is gated on the GitHub Release,
  # not on registry publication: it can backfill a release for a version
  # already live on every registry without rebuilding all five binaries on
  # every later docs or dependency-only push to master.
  build-binaries:
    name: Build binary (${{ matrix.target }})
    if: |
      github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master' &&
      needs.check-versions.outputs.github-release-needed == 'true'
    needs: check-versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal

      # Every target runs on a matching native architecture, so this only
      # registers its standard library — no cross compiler or emulator is
      # involved.
      - name: Add build target
        run: rustup target add ${{ matrix.target }} --toolchain 1.86.0

      - name: Build release binary
        run: cargo +1.86.0 build --release --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: Stage binary for upload
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.check-versions.outputs.npm-version }}"
          target="${{ matrix.target }}"
          src="rust/target/${target}/release/rtsp-backchannel"
          name="rtsp-backchannel-${version}-${target}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
            name="${name}.exe"
          fi

          mkdir -p dist
          cp "$src" "dist/${name}"
          echo "artifact-name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.artifact-name }}
          path: dist/${{ steps.stage.outputs.artifact-name }}
          if-no-files-found: error

  # Backfills and maintains git tags / GitHub Releases, which the registry
  # publishes above never created on their own. Tag and release existence
  # are tracked separately so a retry can finish a release after a prior run
  # pushed the tag but failed before uploading assets. All three packages are
  # already at 0.3.0 with neither tag nor release, so the first run after this
  # merges publishes nothing but still creates v0.3.0 and its release.
  # Blocked only by an actual failure upstream: skipped publish jobs mean
  # "nothing to publish" and are safe, while a failure prevents a release.
  tag-and-release:
    name: Tag release and publish GitHub Release
    needs: [check-versions, publish-npm, publish-pypi, publish-crates, build-binaries]
    if: |
      github.repository == 'GagaKor/rtsp-backchannel' && github.ref == 'refs/heads/master' &&
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.check-versions.outputs.release-tag-exists != 'true' ||
       needs.check-versions.outputs.github-release-needed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create and push the release tag
        if: needs.check-versions.outputs.release-tag-exists != 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.check-versions.outputs.release-tag }}" -m "rtsp-backchannel ${{ needs.check-versions.outputs.npm-version }}"
          git push origin "${{ needs.check-versions.outputs.release-tag }}"

      # Keep a Changelog sections start with "## [<version>] - <date>" and
      # run until the next "## " heading. Match on the version rather than
      # the date since the date isn't known here, and stop at the first
      # following "## [" line so this can never bleed into [Unreleased]
      # above it or the next dated section below it. A version with no
      # section (this method is best-effort, not release-blocking) falls
      # back to a short generated note instead of failing the job.
      - name: Extract changelog section for this version
        if: needs.check-versions.outputs.github-release-needed == 'true'
        id: notes
        run: |
          set -euo pipefail

          version="${{ needs.check-versions.outputs.npm-version }}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          awk -v ver="$version" '
            /^## \[/ {
              if (in_section) exit
              esc = ver
              gsub(/\./, "\\.", esc)
              if ($0 ~ ("^## \\[" esc "\\]")) { in_section = 1 }
            }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            {
              echo "rtsp-backchannel ${version}"
              echo ""
              echo "No changelog section found for this version."
            } > "$notes_file"
          fi

          echo "notes-file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Download built binaries
        if: needs.check-versions.outputs.github-release-needed == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist-binaries

      - name: Create GitHub Release
        if: needs.check-versions.outputs.github-release-needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "${{ needs.check-versions.outputs.release-tag }}" \
            --verify-tag \
            --title "rtsp-backchannel ${{ needs.check-versions.outputs.npm-version }}" \
            --notes-file "${{ steps.notes.outputs.notes-file }}" \
            dist-binaries/*/*
