name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Branch flow
    # Only a pull request has a head branch to judge; a push to master has
    # already happened and this job would have nothing left to protect.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A feature branch merged straight into master skips version-bump.yml,
      # whose job runs only for head_ref == 'dev'. The CHANGELOG entry then
      # exists on master alone, so the next dev -> master pull request reads an
      # empty [Unreleased] and publishes nothing -- the release is lost with
      # every check green. Refuse the merge instead.
      - name: Require dev or dependabot as the source branch
        env:
          # Through the environment, not string interpolation: a branch name is
          # attacker-controlled text and must never be pasted into the script.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
          dev | dependabot/*)
            echo "'$HEAD_REF' may target master."
            ;;
          *)
            echo "::error::'$HEAD_REF' cannot target master. Retarget this pull request at 'dev'; master takes only 'dev' and dependabot branches. See CONTRIBUTING.md."
            exit 1
            ;;
          esac

  typescript:
    name: TypeScript / Node.js 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm pack --dry-run --json

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade build twine
      - run: PYTHONPATH=python:. python -m unittest discover -s python -p 'test_*.py'
      - run: python -m build --outdir "$RUNNER_TEMP/python-dist" python
      - run: python -m twine check "$RUNNER_TEMP"/python-dist/*

  rust:
    name: Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.86.0 fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +1.86.0 test --manifest-path rust/Cargo.toml --locked
      - run: cargo +1.86.0 clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.86.0 package --manifest-path rust/Cargo.toml --locked
